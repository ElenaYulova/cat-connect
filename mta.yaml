_schema-version: 3.3.0
ID: cat-connect
version: 1.0.72
description: "Gamer CRM Application built with SAP CAP."
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --legacy-peer-deps
        - npm run build
        - mkdir -p router/sales_order
        - cp -r dist/. router/sales_order/

modules:
  # Node.js CAP Backend Service
  - name: cat-connect-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      stack: cflinuxfs4
    build-parameters:
      builder: custom
      commands:
        - npm ci --production --legacy-peer-deps
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: cat-connect-db

  # HANA Cloud Schema Deployer
  - name: cat-connect-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      stack: cflinuxfs4
    requires:
      - name: cat-connect-db

  # SAP AppRouter Module
  - name: cat-connect
    type: approuter.nodejs
    path: router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    build-parameters:
      before-builder:
        - rm -rf crm_customers sales_order
        - mkdir -p crm_customers sales_order
        - cp -r ../app/crm_customers/. ./crm_customers/ 2>/dev/null || true
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: false

resources:
  # SAP HANA Cloud HDI Container
  - name: cat-connect-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
