_schema-version: 3.3.0
ID: cat-connect
version: 1.0.21
description: "Gamer CRM Application built with SAP CAP."
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --omit=dev --legacy-peer-deps
        - npx cds build --production

modules:
  # Node.js CAP Backend
  - name: cat-connect-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: cat-connect-db
      - name: cat-connect-xsuaa

  # HANA Cloud Schema Deployer
  - name: cat-connect-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: cat-connect-db

  # SAP AppRouter + FIORI ELEMENTS
  - name: cat-connect
    type: approuter.nodejs
    path: router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    properties:
      TENANT_HOST_PATTERN: "^(.*).cfapps.us10-001.hana.ondemand.com"
    build-parameters:
      before-builder:
        - mkdir -p crm_customers
        - cp -r ../app/crm_customers/* ./crm_customers/
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: cat-connect-xsuaa

resources:
  # SAP HANA Cloud
  - name: cat-connect-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # XSUAA
  - name: cat-connect-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
