_schema-version: 3.3.0
ID: cat-connect
version: 1.1.11
description: "Gamer CRM Application built with SAP CAP."
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --legacy-peer-deps
        - npm run build

modules:
  # Node.js CAP Backend Service
  - name: cat-connect-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      stack: cflinuxfs4
    build-parameters:
      builder: custom
      commands:
        - npm ci --production --legacy-peer-deps
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: cat-connect-db
      - name: cat-connect-uaa

  # HANA Cloud Schema Deployer
  - name: cat-connect-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      stack: cflinuxfs4
    requires:
      - name: cat-connect-db

  # SAP AppRouter Module
  - name: cat-connect
    type: approuter.nodejs
    path: router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    # Fix for XSUAA 403 Error
    properties:
      TENANT_HOST_PATTERN: "^(.*)-dev-cat-connect\\.cfapps\\.us10-001\\.hana\\.ondemand\\.com$"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: cat-connect-uaa
    build-parameters:
      before-builder:
        - rm -rf crm_customers
        - mkdir -p crm_customers
        - cp -r ../app/crm_customers/. ./crm_customers/ 2>/dev/null || true
      requires:
        - name: cat-connect-srv
          artifacts:
            - dist/*
          target: ./sales_order

resources:
  # SAP HANA Cloud HDI Container
  - name: cat-connect-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  # SAP XSUAA Security Service
  - name: cat-connect-uaa
    type: com.sap.xs.uaa
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
