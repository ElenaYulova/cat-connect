name: SAP BTP Continuous Deployment

on:
  push:
    branches: [dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run CRM Integration Tests 🧪
        run: npm run test:crm

      - name: Configure Git for Versioning
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Automatically Bump Project Version 🏷️
        # Version setter
        run: 'npm version patch -m "Build: bump version to %s" --no-git-tag-version'

      - name: Install SAP MTA Build Tool (MBT)
        run: npm install -g mbt

      - name: Compile CAP Framework and Build MTA Archive 🧱
        run: mbt build

      - name: Install Cloud Foundry CLI & MTA Plugin 🛠️
        uses: cloudfoundry/cli-action@v2
        with:
          cf_api: "https://api.cf.us10-001.hana.ondemand.com"
          cf_username: ${{ secrets.BTP_USER }}
          cf_password: ${{ secrets.BTP_PASSWORD }}
          cf_org: "7ac3bc9btrial"
          cf_space: "dev"

      - name: Authenticate and Deploy to SAP BTP Cloud Foundry 🚀
        env:
          CF_API: "https://api.cf.us10-001.hana.ondemand.com"
          CF_USER: ${{ secrets.BTP_USER }}
          CF_PASSWORD: ${{ secrets.BTP_PASSWORD }}
          CF_ORG: "7ac3bc9btrial"
          CF_SPACE: "dev"
        run: |
          # 🔮 Авторизация уже выполнена плагином выше, просто накатываем деплой собранного архива!
          cf deploy mta_archives/cat-connect_*.mtar --delete-services -f
