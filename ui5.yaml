specVersion: "3.1"
metadata:
  name: cat-connect
type: application
resources:
  configuration:
    paths:
      webapp: webapp
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transpileTypeScript: true
        exclude: ["/resources/**"]
        includes: ["**/*.ts"]