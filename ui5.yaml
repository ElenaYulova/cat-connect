specVersion: "3.1"
metadata:
  name: cat-connect
type: application
resources:
  configuration:
    paths:
      webapp: webapp
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        exclude: ["/resources/**"]
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transpileTypeScript: true
        exclude: ["/resources/**"]
        includes: ["**/*.ts"]
    - name: fiori-tools-proxy
      afterMiddleware: ui5-tooling-transpile-middleware
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://sap.com
        backend:
          - path: /odata/v4/sales-order
            url: http://localhost:4004
          - path: /odata/v4/crm
            url: http://localhost:4004
          - path: /odata/v4/mdm
            url: http://localhost:4004

    - name: fiori-tools-servestatic
      afterMiddleware: compression
      configuration:
        paths:
          - path: /crm_customers
            src: app/crm_customers
          - path: /mdm_app
            src: app/mdm-management/webapp
