<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <script id="sap-ui-bootstrap"></script>
    <script id="sap-ui-bootstrap"></script>
    <script id="sap-ui-bootstrap"></script>
    <script>
        (function () {
            const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

            const localSrc = "resources/sap-ui-core.js";
            const cdnSrc = "https://ui5.sap.com/resources/sap-ui-core.js";

            const resourcePath = "./";

            const bootstrapScript = document.getElementById("sap-ui-bootstrap");

            bootstrapScript.setAttribute("src", isLocal ? localSrc : cdnSrc);
            bootstrapScript.setAttribute("data-sap-ui-resourceroots", JSON.stringify({
                "sap.capire.gameshop": resourcePath
            }));

            bootstrapScript.setAttribute("data-sap-ui-theme", "sap_horizon_dark");
            bootstrapScript.setAttribute("data-sap-ui-libs", "sap.m, sap.f, sap.ui.layout");
            bootstrapScript.setAttribute("data-sap-ui-compat-version", "edge");
            bootstrapScript.setAttribute("data-sap-ui-preload", "none");
            bootstrapScript.setAttribute("data-sap-ui-async", "true");
            bootstrapScript.setAttribute("data-sap-ui-language", "en"); // TODO: replace fix for hardcoded EN locale
            bootstrapScript.setAttribute("data-sap-ui-on-init", "module:sap/ui/core/ComponentSupport");
        })();
    </script>

</head>

<body class="sapUiBody" id="content">

    <!-- Project initialization -->
    <div data-sap-ui-component data-name="sap.capire.gameshop" data-id="container" data-settings='{"id" : "gameshop"}'>
    </div>

</body>

</html>
