<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cat-connect Enterprise Launchpad</title>

    <!-- USER REDIRECT CONTROLLER: Evaluate cloud XSUAA token scopes on entry -->
    <script>
        (function () {
            fetch('/user-api/attributes')
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('User API offline');
                })
                .then(data => {
                    if (data && data.scopes) {
                        const scopes = data.scopes;

                        const isCustomer = scopes.some(scope => scope.endsWith('.Customer'));
                        const isAdminOrManager = scopes.some(scope => scope.endsWith('.CRMAdmin') || scope.endsWith('.SalesManager'));

                        if (isCustomer && !isAdminOrManager) {
                            window.location.replace("/sales_order/index.html");
                        }
                    }
                })
                .catch(err => console.log("Local or anonymous run, bypass redirect", err));
        })();
    </script>


    <script>
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            search: "false",
                            enableSpaces: true,
                            enableDynamicPageTitle: true
                        }
                    }
                }
            },
            services: {
                LaunchPage: { "adapter": { "config": { "catalogs": [], "groups": [] } } },
                ClientSideTargetResolution: { "adapter": { "config": { "inbound": {} } } },
                NavTargetResolution: {
                    config: {
                        enableDynamicReferences: false,
                        allowGuestAccess: false,
                        applications: {
                            "SalesOrder-display": {
                                "additionalInformation": "SAPUI5.Component=sap.capire.gameshop",
                                "applicationType": "URL",
                                "url": "./",
                                "description": "Manage Sales Orders",
                                "title": "Sales Orders"
                            },
                            "CrmCustomers-display": {
                                "additionalInformation": "SAPUI5.Component=crmcustomers",
                                "applicationType": "URL",
                                "url": "/crm_app",
                                "description": "Gamer CRM Subsystem",
                                "title": "CRM Customers"
                            },
                            "MasterData-manage": {
                                "additionalInformation": "SAPUI5.Component=sap.capire.gameshop.mdm",
                                "applicationType": "URL",
                                "url": "/mdm_app", 
                                "description": "Master Data Management Subsystem",
                                "title": "Master Data Management"
                            }
                        }
                    }
                }
            }
        }
    </script>

    <script id="sap-ushell-bootstrap"></script>
    <script id="sap-ui-bootstrap"></script>
    <script>
        (function () {
            const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

            const cdnSandbox = "https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js";
            const cdnCore = "https://ui5.sap.com/resources/sap-ui-core.js";


            const sandboxScript = document.getElementById("sap-ushell-bootstrap");
            sandboxScript.setAttribute("src", cdnSandbox);

            const coreScript = document.getElementById("sap-ui-bootstrap");
            coreScript.setAttribute("src", cdnCore);
            coreScript.setAttribute("data-sap-ui-componentPreload", "off");

            coreScript.setAttribute("data-sap-ui-theme", "sap_horizon_dark");
            coreScript.setAttribute("data-sap-ui-libs", "sap.m, sap.ushell, sap.fe.templates");
            coreScript.setAttribute("data-sap-ui-compatVersion", "edge");
            coreScript.setAttribute("data-sap-ui-async", "true");
            coreScript.setAttribute("data-sap-ui-language", "en");
            coreScript.setAttribute("data-sap-ui-frameOptions", "allow");
        })();
    </script>

    <script>
        window.addEventListener("load", function () {
            if (typeof sap !== "undefined" && sap.ui) {
                sap.ui.require(["sap/ui/core/Core", "sap/ushell/Container"], function (Core, Container) {
                    Core.ready().then(function () {

                        if (sap && sap.ui && sap.ui.loader) {
                            sap.ui.loader.config({
                                paths: {
                                    "sap/capire/gameshop/mdm": "/mdm_app"
                                }
                            });
                        }

                        sap.ushell.Container.createRenderer("fiori2", true)
                            .then(function (oRenderer) {
                                oRenderer.placeAt("content");
                            })
                            .catch(function (oError) {
                                console.error("Shell renderer creation failed:", oError);
                            });
                    });
                });
            } else {
                console.error("Critical error: SAPUI5 framework failed to load.");
            }
        });
    </script>
</head>

<body class="sapUiBody" id="content">
</body>

</html>
